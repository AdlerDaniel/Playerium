<!DOCTYPE html>
<html lang="ru">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https:; media-src 'self' blob: playerium-audio:; connect-src 'self' https://api.github.com; object-src 'none'; base-uri 'none'; frame-src 'none'">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#121212">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Playerium - Музыкальный плеер</title>
  
  <!-- App Icon -->
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="icon" type="image/png" href="assets/icon.png">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/topbar.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/tracklist.css">
  <link rel="stylesheet" href="css/player.css">
  <link rel="stylesheet" href="css/rightbar.css">
  <link rel="stylesheet" href="css/settings.css">
  <link rel="stylesheet" href="css/mobile.css">
  <link rel="stylesheet" href="css/spotify-layout.css">
  <link rel="stylesheet" href="css/search.css">
  <link rel="stylesheet" href="css/spotify-surfaces.css">
</head>
<body>
  <div id="app">
        <header class="topbar" id="mainTopbar">
          <div class="topbar-left">
<button class="app-brand" id="btnBrandHome" aria-label="Playerium — главная"><img src="assets/icon.svg" alt=""></button>
<button class="global-home-btn" id="btnGlobalHome" aria-label="Главная"><svg viewBox="0 0 24 24"><path d="m12 2-10 8v12h7v-8h6v8h7V10z"/></svg></button>


            <!-- Search Bar -->
            <div class="search-container">
              <span class="search-icon">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M10.533 1.279c-5.18 0-9.407 4.14-9.407 9.279s4.226 9.279 9.407 9.279c2.234 0 4.29-.77 5.907-2.058l4.353 4.353a1 1 0 1 0 1.414-1.414l-4.344-4.344a9.157 9.157 0 0 0 2.077-5.816c0-5.14-4.226-9.279-9.407-9.279zm-7.407 9.279c0-4.006 3.302-7.279 7.407-7.279s7.407 3.273 7.407 7.279-3.302 7.279-7.407 7.279-7.407-3.273-7.407-7.279z"/></svg>
              </span>
              <input type="text" class="search-input" id="mainSearchInput" placeholder="Что хочешь включить?" autocomplete="off" spellcheck="false">
              <button class="search-clear-btn" id="searchClearBtn" title="Очистить поиск">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
              </button>
            </div>
          </div>

          <div class="topbar-right">
            <button class="topbar-btn" id="btnOpenSettings" data-tooltip="Настройки" aria-label="Настройки">
<span class="profile-avatar">P</span>
            </button>
          </div>
        </header>
    <!-- Top & Content Body -->
    <div class="app-body">
      <!-- Left Sidebar (Моя медиатека) -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <button class="library-btn" id="btnLibraryHeader" title="Моя медиатека">
            <svg viewBox="0 0 24 24"><path d="M3 22a1 1 0 0 1-1-1V3a1 1 0 0 1 2 0v18a1 1 0 0 1-1 1zM15.5 2.1a1 1 0 0 0-1.07.2l-8 7a1 1 0 0 0 0 1.4l8 7a1 1 0 0 0 1.07.2 1 1 0 0 0 .5-.8V3a1 1 0 0 0-.5-.9zM21 2a1 1 0 0 0-1 1v18a1 1 0 0 0 2 0V3a1 1 0 0 0-1-1z"/></svg>
            <span>Моя медиатека</span>
          </button>
          <div class="sidebar-actions">
            <button class="icon-circle-btn" id="btnCreatePlaylist" data-tooltip="Создать плейлист">
              <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            </button>
            <button class="icon-circle-btn" id="btnAddMusicFolder" data-tooltip="Добавить папку с музыкой">
              <svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
            </button>
          </div>
        </div>

        <!-- Sidebar Filter Pills -->
        <div class="sidebar-filters">
          <button class="pill-btn active" data-filter="all">Все</button>
          <button class="pill-btn" data-filter="playlists">Плейлисты</button>
          <button class="pill-btn" data-filter="artists">Исполнители</button>
          <button class="pill-btn" data-filter="albums">Альбомы</button>
        </div>

        <div class="library-tools"><label class="library-search" aria-label="Поиск в медиатеке"><svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 1 0 4.9 14.3L21 22l1-1-5.7-6.1A8 8 0 0 0 10 2zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12z"/></svg><input id="librarySearchInput" placeholder="Поиск в медиатеке" aria-label="Поиск в медиатеке"></label></div>
        <!-- Sidebar List Items -->
        <div class="sidebar-list" id="sidebarList">
          <!-- Populated by UIController -->
        </div>
      </aside>

      <!-- Main Center Content Area -->
      <main class="main-view-container">
        <!-- Sticky Topbar -->


        <div class="content-history">            <div class="history-nav">
              <button class="nav-circle-btn" id="btnNavBack" data-tooltip="Назад" disabled>
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
              </button>
              <button class="nav-circle-btn" id="btnNavForward" data-tooltip="Вперед" disabled>
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
              </button>
            </div></div>
        <!-- Scrollable Main View Content -->
        <div class="main-view" id="mainScrollContainer">
          <div id="mainViewContent">
            <!-- Dynamic Content (Home, Playlists, Artists, Settings) -->
          </div>
        </div>
      </main>

      <!-- Right Panel (Now Playing / Queue) -->
      <aside class="right-panel hidden" id="rightPanel">
        <div class="right-panel-header">
          <span class="right-panel-title">Сведения</span>
          <button class="icon-circle-btn" id="btnCloseRightPanel" title="Закрыть панель">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          </button>
        </div>
        <div class="right-panel-tabs">
          <button class="panel-tab-btn active" id="tabBtnNowPlaying">Сейчас играет</button>
          <button class="panel-tab-btn" id="tabBtnQueue">Очередь</button>
        </div>
        <div class="right-panel-content" id="rightPanelContent">
          <!-- Populated by UIController -->
        </div>
      </aside>
    </div>

    <!-- Bottom Player Bar (Spotify Dock) -->
    <footer class="bottom-player">
      <!-- Left: Track info -->
      <div class="player-left">
        <div class="now-playing-thumb" id="nowPlayingCover">
          <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        </div>
        <div class="now-playing-info">
          <div class="now-playing-title" id="nowPlayingTitle">Выберите трек для воспроизведения</div>
          <div class="now-playing-artist" id="nowPlayingArtist">Локальная медиатека</div>
        </div>
        <button class="now-playing-like" id="btnPlayerLike" title="Добавить в любимые">
          <svg viewBox="0 0 16 16"><path d="M8 1.314C12.438-3.248 23.534 4.735 8 15-7.534 4.736 3.562-3.248 8 1.314z"/></svg>
        </button>
      </div>

      <!-- Center: Controls & Scrubber -->
      <div class="player-center">
        <div class="playback-controls">
          <button class="control-btn" id="btnShuffle" data-tooltip="Перемешивание">
            <svg viewBox="0 0 16 16"><path d="M13.151.922a.75.75 0 1 0-1.06 1.06L13.109 3H11.16a3.75 3.75 0 0 0-2.873 1.34l-6.173 7.356A2.25 2.25 0 0 1 .39 12.5H0V14h.391a3.75 3.75 0 0 0 2.873-1.34l6.173-7.356a2.25 2.25 0 0 1 1.724-.804h1.947l-1.017 1.018a.75.75 0 0 0 1.06 1.06L15.98 3.75 13.15.922zM.391 3.5H0V2h.391c1.109 0 2.16.49 2.873 1.34L4.89 5.277l-.979 1.167-1.796-2.14A2.25 2.25 0 0 0 .39 3.5zM11.16 13h1.948l-1.017-1.018a.75.75 0 0 1 1.06-1.06L15.98 13.75l-2.83 2.828a.75.75 0 1 1-1.06-1.06l1.018-1.018H11.16a3.75 3.75 0 0 1-2.873-1.34l-1.625-1.938.979-1.167 1.626 1.94A2.25 2.25 0 0 0 11.16 13z"/></svg>
          </button>
          <button class="control-btn" id="btnPrev" data-tooltip="Предыдущий">
            <svg viewBox="0 0 16 16"><path d="M3.3 1a.7.7 0 0 1 .7.7v5.15l9.95-5.744a.7.7 0 0 1 1.05.606v12.575a.7.7 0 0 1-1.05.607L4 9.149V14.3a.7.7 0 0 1-.7.7H1.7a.7.7 0 0 1-.7-.7V1.7a.7.7 0 0 1 .7-.7h1.6z"/></svg>
          </button>
          <button class="btn-play-pause" id="btnPlayPause" data-tooltip="Воспроизведение">
            <svg id="playerPlayIcon" viewBox="0 0 16 16"><path d="M3 1.713a.7.7 0 0 1 1.05-.607l10.89 6.288a.7.7 0 0 1 0 1.212L4.05 14.894A.7.7 0 0 1 3 14.287V1.713z"/></svg>
            <svg id="playerPauseIcon" viewBox="0 0 16 16" style="display: none;"><path d="M2.7 1a.7.7 0 0 0-.7.7v12.6a.7.7 0 0 0 .7.7h2.6a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7H2.7zm8 0a.7.7 0 0 0-.7.7v12.6a.7.7 0 0 0 .7.7h2.6a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7h-2.6z"/></svg>
          </button>
          <button class="control-btn" id="btnNext" data-tooltip="Следующий">
            <svg viewBox="0 0 16 16"><path d="M12.7 1a.7.7 0 0 0-.7.7v5.15L2.05 1.107A.7.7 0 0 0 1 1.712v12.575a.7.7 0 0 0 1.05.607L12 9.149V14.3a.7.7 0 0 0 .7.7h1.6a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7h-1.6z"/></svg>
          </button>
          <button class="control-btn" id="btnRepeat" data-tooltip="Повтор">
            <svg viewBox="0 0 16 16"><path d="M0 4.75A3.75 3.75 0 0 1 3.75 1h8.5A3.75 3.75 0 0 1 16 4.75v5a3.75 3.75 0 0 1-3.75 3.75H9.81l1.018 1.018a.75.75 0 1 1-1.06 1.06L6.939 12.75l2.829-2.828a.75.75 0 1 1 1.06 1.06L9.811 12h2.439a2.25 2.25 0 0 0 2.25-2.25v-5a2.25 2.25 0 0 0-2.25-2.25h-8.5A2.25 2.25 0 0 0 1.5 4.75v5A2.25 2.25 0 0 0 3.75 12H5v1.5H3.75A3.75 3.75 0 0 1 0 9.75v-5z"/></svg>
          </button>
        </div>

        <!-- Progress scrubber -->
        <div class="playback-bar">
          <span class="playback-time current" id="currentTimeLabel">0:00</span>
          <div class="progress-slider-container" id="progressSliderContainer">
            <div class="progress-slider-bg">
              <div class="progress-slider-fill" id="progressSliderFill">
                <div class="progress-slider-handle"></div>
              </div>
            </div>
            <div class="time-hover-tooltip" id="timeHoverTooltip">0:00</div>
          </div>
          <span class="playback-time total" id="totalTimeLabel">0:00</span>
        </div>
      </div>

      <!-- Right: Queue, Volume -->
      <div class="player-right">
        <button class="control-btn" id="btnToggleQueue" data-tooltip="Очередь">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M15 15H1v-1.5h14V15zm0-4.5H1V9h14v1.5zm-14-7A2.5 2.5 0 0 1 3.5 1h9a2.5 2.5 0 0 1 2.5 2.5v2a.75.75 0 0 1-1.5 0v-2a1 1 0 0 0-1-1h-9a1 1 0 0 0-1 1v2a.75.75 0 0 1-1.5 0v-2z"/></svg>
        </button>
        <div class="volume-bar-container">
          <button class="control-btn" id="btnVolumeIcon" data-tooltip="Громкость">
            <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M9.741.85a.75.75 0 0 1 .375.65v13a.75.75 0 0 1-1.125.65l-6.925-4H.75A.75.75 0 0 1 0 10.4V5.6a.75.75 0 0 1 .75-.75h1.316l6.925-4a.75.75 0 0 1 .75 0zm-2 2.53L2.991 6.13H1.5v3.74h1.491l4.75 2.75V3.38zm4.28 1.83a.75.75 0 0 1 1.06 0 4 4 0 0 1 0 5.66.75.75 0 1 1-1.06-1.06 2.5 2.5 0 0 0 0-3.54.75.75 0 0 1 0-1.06zm2.122-2.122a.75.75 0 0 1 1.06 0 7 7 0 0 1 0 9.9.75.75 0 1 1-1.06-1.06 5.5 5.5 0 0 0 0-7.78.75.75 0 0 1 0-1.06z"/></svg>
          </button>
          <div class="volume-slider-container" id="volumeSliderContainer">
            <div class="volume-slider-bg">
              <div class="volume-slider-fill" id="volumeSliderFill">
                <div class="volume-slider-handle"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </footer>

    <!-- Spotify Mobile Floating Mini-Player -->
    <div class="mobile-mini-player hidden" id="mobileMiniPlayer">
      <div class="mobile-mini-cover" id="mobileMiniCover">
        <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      </div>
      <div class="mobile-mini-info">
        <div class="mobile-mini-title" id="mobileMiniTitle">Выберите трек</div>
        <div class="mobile-mini-artist" id="mobileMiniArtist">Playerium</div>
      </div>
      <div class="mobile-mini-actions">
        <button class="mobile-mini-btn like-btn" id="mobileMiniLike" title="Мне нравится">
          <svg viewBox="0 0 16 16"><path d="M8 1.314C12.438-3.248 23.534 4.735 8 15-7.534 4.736 3.562-3.248 8 1.314z"/></svg>
        </button>
        <button class="mobile-mini-btn" id="mobileMiniPlayPause" title="Воспроизведение">
          <svg id="mobileMiniPlayIcon" viewBox="0 0 16 16"><path d="M3 1.713a.7.7 0 0 1 1.05-.607l10.89 6.288a.7.7 0 0 1 0 1.212L4.05 14.894A.7.7 0 0 1 3 14.287V1.713z"/></svg>
          <svg id="mobileMiniPauseIcon" viewBox="0 0 16 16" style="display: none;"><path d="M2.7 1a.7.7 0 0 0-.7.7v12.6a.7.7 0 0 0 .7.7h2.6a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7H2.7zm8 0a.7.7 0 0 0-.7.7v12.6a.7.7 0 0 0 .7.7h2.6a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7h-2.6z"/></svg>
        </button>
      </div>
      <div class="mobile-mini-progress-bar">
        <div class="mobile-mini-progress-fill" id="mobileMiniProgressFill"></div>
      </div>
    </div>

    <!-- Spotify Mobile Bottom Navigation Bar -->
    <nav class="mobile-nav-bar" id="mobileNavBar">
      <button class="mobile-nav-item active" id="mobileNavHome">
        <svg viewBox="0 0 24 24"><path d="M12.5 3.247a1 1 0 0 0-1 0L4 7.577V20h4.5v-6a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v6H20V7.577l-7.5-4.33z"/></svg>
        <span>Главная</span>
      </button>
      <button class="mobile-nav-item" id="mobileNavSearch">
        <svg viewBox="0 0 24 24"><path d="M10.533 1.279c-5.18 0-9.407 4.14-9.407 9.279s4.226 9.279 9.407 9.279c2.234 0 4.29-.77 5.907-2.058l4.353 4.353a1 1 0 1 0 1.414-1.414l-4.344-4.344a9.157 9.157 0 0 0 2.077-5.816c0-5.14-4.226-9.279-9.407-9.279zm-7.407 9.279c0-4.006 3.302-7.279 7.407-7.279s7.407 3.273 7.407 7.279-3.302 7.279-7.407 7.279-7.407-3.273-7.407-7.279z"/></svg>
        <span>Поиск</span>
      </button>
      <button class="mobile-nav-item" id="mobileNavLibrary">
        <svg viewBox="0 0 24 24"><path d="M3 22a1 1 0 0 1-1-1V3a1 1 0 0 1 2 0v18a1 1 0 0 1-1 1zM15.5 2.1a1 1 0 0 0-1.07.2l-8 7a1 1 0 0 0 0 1.4l8 7a1 1 0 0 0 1.07.2 1 1 0 0 0 .5-.8V3a1 1 0 0 0-.5-.9zM21 2a1 1 0 0 0-1 1v18a1 1 0 0 0 2 0V3a1 1 0 0 0-1-1z"/></svg>
        <span>Медиатека</span>
      </button>
      <button class="mobile-nav-item" id="mobileNavCreate" aria-label="Создать">
        <svg viewBox="0 0 24 24"><path d="M11 3h2v8h8v2h-8v8h-2v-8H3v-2h8z"/></svg><span>Создать</span>
      </button>
    </nav>

    <!-- Spotify Mobile Fullscreen Player Sheet -->
    <div class="mobile-fullscreen-player" id="mobileFullscreenPlayer" role="dialog" aria-modal="true" aria-label="Сейчас играет">
      <div class="mobile-fs-header">
        <button class="mobile-fs-btn" id="btnMobileFsClose" title="Свернуть">
          <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
        </button>
        <div class="mobile-fs-context">
          <div class="mobile-fs-context-subtitle">Играет из плейлиста</div>
          <div class="mobile-fs-context-title" id="mobileFsContextTitle">Все треки</div>
        </div>
        <button class="mobile-fs-btn" id="btnMobileFsOptions" title="Опции">
          <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
        </button>
      </div>

      <div class="mobile-fs-artwork-container">
        <div class="mobile-fs-artwork" id="mobileFsArtwork">
          <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        </div>
      </div>

      <div class="mobile-fs-info-row">
        <div class="mobile-fs-title-col">
          <div class="mobile-fs-track-title" id="mobileFsTitle">Выберите трек</div>
          <div class="mobile-fs-track-artist" id="mobileFsArtist">Playerium</div>
        </div>
        <button class="mobile-fs-like-btn" id="btnMobileFsLike" title="Мне нравится">
          <svg viewBox="0 0 16 16"><path d="M8 1.314C12.438-3.248 23.534 4.735 8 15-7.534 4.736 3.562-3.248 8 1.314z"/></svg>
        </button>
      </div>

      <div class="mobile-fs-scrubber">
        <input type="range" class="mobile-fs-slider" id="mobileFsSlider" min="0" max="100" value="0" step="0.1">
        <div class="mobile-fs-time-row">
          <span id="mobileFsTimeCurrent">0:00</span>
          <span id="mobileFsTimeTotal">0:00</span>
        </div>
      </div>

      <div class="mobile-fs-controls">
        <button class="mobile-fs-ctrl-btn" id="btnMobileFsShuffle" title="Перемешать">
          <svg viewBox="0 0 16 16"><path d="M13.151.922a.75.75 0 1 0-1.06 1.06L13.109 3H11.16a3.75 3.75 0 0 0-2.873 1.34l-6.173 7.356A2.25 2.25 0 0 1 .39 12.5H0V14h.391a3.75 3.75 0 0 0 2.873-1.34l6.173-7.356a2.25 2.25 0 0 1 1.724-.804h1.947l-1.017 1.018a.75.75 0 0 0 1.06 1.06L15.98 3.75 13.15.922zM.391 3.5H0V2h.391c1.109 0 2.16.49 2.873 1.34L4.89 5.277l-.979 1.167-1.796-2.14A2.25 2.25 0 0 0 .39 3.5zM11.16 13h1.948l-1.017-1.018a.75.75 0 0 1 1.06-1.06L15.98 13.75l-2.83 2.828a.75.75 0 1 1-1.06-1.06l1.018-1.018H11.16a3.75 3.75 0 0 1-2.873-1.34l-1.625-1.938.979-1.167 1.626 1.94A2.25 2.25 0 0 0 11.16 13z"/></svg>
        </button>
        <button class="mobile-fs-ctrl-btn" id="btnMobileFsPrev" title="Предыдущий">
          <svg viewBox="0 0 16 16"><path d="M3.3 1a.7.7 0 0 1 .7.7v5.15l9.95-5.744a.7.7 0 0 1 1.05.606v12.575a.7.7 0 0 1-1.05.607L4 9.149V14.3a.7.7 0 0 1-.7.7H1.7a.7.7 0 0 1-.7-.7V1.7a.7.7 0 0 1 .7-.7h1.6z"/></svg>
        </button>
        <button class="mobile-fs-play-btn" id="btnMobileFsPlayPause" title="Воспроизведение">
          <svg id="mobileFsPlayIcon" viewBox="0 0 16 16"><path d="M3 1.713a.7.7 0 0 1 1.05-.607l10.89 6.288a.7.7 0 0 1 0 1.212L4.05 14.894A.7.7 0 0 1 3 14.287V1.713z"/></svg>
          <svg id="mobileFsPauseIcon" viewBox="0 0 16 16" style="display: none;"><path d="M2.7 1a.7.7 0 0 0-.7.7v12.6a.7.7 0 0 0 .7.7h2.6a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7H2.7zm8 0a.7.7 0 0 0-.7.7v12.6a.7.7 0 0 0 .7.7h2.6a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7h-2.6z"/></svg>
        </button>
        <button class="mobile-fs-ctrl-btn" id="btnMobileFsNext" title="Следующий">
          <svg viewBox="0 0 16 16"><path d="M12.7 1a.7.7 0 0 0-.7.7v5.15L2.05 1.107A.7.7 0 0 0 1 1.712v12.575a.7.7 0 0 0 1.05.607L12 9.149V14.3a.7.7 0 0 0 .7.7h1.6a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7h-1.6z"/></svg>
        </button>
        <button class="mobile-fs-ctrl-btn" id="btnMobileFsRepeat" title="Повтор">
          <svg viewBox="0 0 16 16"><path d="M0 4.75A3.75 3.75 0 0 1 3.75 1h8.5A3.75 3.75 0 0 1 16 4.75v5a3.75 3.75 0 0 1-3.75 3.75H9.81l1.018 1.018a.75.75 0 1 1-1.06 1.06L6.939 12.75l2.829-2.828a.75.75 0 1 1 1.06 1.06L9.811 12h2.439a2.25 2.25 0 0 0 2.25-2.25v-5a2.25 2.25 0 0 0-2.25-2.25h-8.5A2.25 2.25 0 0 0 1.5 4.75v5A2.25 2.25 0 0 0 3.75 12H5v1.5H3.75A3.75 3.75 0 0 1 0 9.75v-5z"/></svg>
        </button>
      </div>

      <div class="mobile-fs-utils">
        <button class="mobile-fs-util-btn" id="btnMobileFsEq" title="Эквалайзер">
          <svg viewBox="0 0 24 24"><path d="M10 20h4V4h-4v16zm-6 0h4v-8H4v8zM16 9v11h4V9h-4z"/></svg>
          <span>Эквалайзер</span>
        </button>
        <button class="mobile-fs-util-btn" id="btnMobileFsQueue" title="Очередь треков">
          <svg viewBox="0 0 16 16"><path d="M15 15H1v-1.5h14V15zm0-4.5H1V9h14v1.5zm-14-7A2.5 2.5 0 0 1 3.5 1h9a2.5 2.5 0 0 1 2.5 2.5v2a.75.75 0 0 1-1.5 0v-2a1 1 0 0 0-1-1h-9a1 1 0 0 0-1 1v2a.75.75 0 0 1-1.5 0v-2z"/></svg>
          <span>Очередь</span>
        </button>
        <button class="mobile-fs-util-btn" id="btnMobileFsShare" aria-label="Поделиться треком"><svg viewBox="0 0 24 24"><path d="M12 16V3m-4 4 4-4 4 4M5 11v10h14V11" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
      </div>
      <section class="mobile-fs-details"><button id="btnMobileFsAlbum" class="fs-detail-card"><span>Альбом</span><strong id="mobileFsAlbum">Добавленные</strong></button><button id="btnMobileFsArtist" class="fs-detail-card"><span>Об исполнителе</span><strong id="mobileFsAboutArtist">Исполнитель</strong></button></section>
    </div>
  </div>

  <!-- Hidden Fallback Folder Picker -->
  <input type="file" id="hiddenFolderPicker" webkitdirectory directory multiple style="display: none;">
  <!-- Hidden Audio Files Picker for Mobile -->
  <input type="file" id="hiddenAudioFilesPicker" accept="audio/*" multiple style="display: none;">

  <!-- Context Menu -->
  <div class="context-menu" id="appContextMenu"></div>

  <!-- Modal: Update Available -->
  <div class="modal-overlay" id="modalUpdateAvailable" role="dialog" aria-modal="true" aria-labelledby="updateHeading">
    <div class="modal-card update-card">
      <div class="modal-header"><h2 id="updateHeading">Изменения</h2></div>
      <div class="modal-body">
        <ul id="updateModalNotes" class="update-notes"></ul>
        <div id="updateDownloadStatus" class="update-status" hidden>
          <span id="updateStatusText" role="status" aria-live="polite"></span>
          <div id="updateProgress" class="update-progress" role="progressbar" aria-label="Загрузка обновления" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="updateProgressBarFill"></div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="settings-btn-secondary" id="btnUpdateLater">Игнорировать</button>
        <button id="btnDownloadUpdate" class="settings-btn-primary">Обновить</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Application Script (ES6 Modules) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
