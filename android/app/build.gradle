apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'

android {
    namespace "com.playerium.music"
    compileSdk 34

    defaultConfig {
        applicationId "com.playerium.music"
        minSdk 22
        targetSdk 34
        versionCode 61
        versionName "1.7.47"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    def releaseStore = System.getenv("PLAYERIUM_KEYSTORE_PATH") ?: "playerium.keystore"
    def storePass = System.getenv("PLAYERIUM_STORE_PASSWORD")
    def keyPass = System.getenv("PLAYERIUM_KEY_PASSWORD")
    def aliasName = System.getenv("PLAYERIUM_KEY_ALIAS")
    def signingReady = file(releaseStore).exists() && storePass && keyPass && aliasName
    signingConfigs {
        release {
            if (signingReady) {
                storeFile file(releaseStore)
                storePassword storePass
                keyAlias aliasName
                keyPassword keyPass
            }
        }
    }
    gradle.taskGraph.whenReady { graph ->
        if (graph.allTasks.any { it.name.toLowerCase().contains("release") } && !signingReady) {
            throw new GradleException("Release signing secrets are missing. Configure the existing Playerium key; do not generate a replacement.")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packagingOptions { jniLibs { useLegacyPackaging true } }

    buildTypes {
        debug { }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

}

repositories {
    google()
    mavenCentral()
}

// Android resource qualifiers require a language before a region. Generate the
// small name-only overrides so RU also works with English, German, etc.
def regionalNameResources = layout.buildDirectory.dir("generated/res/regionalAppName")
android.sourceSets.main.res.srcDir(regionalNameResources)
tasks.register("generateRegionalAppNames") {
    outputs.dir(regionalNameResources)
    doLast {
        def root = regionalNameResources.get().asFile
        assert root.canonicalPath.startsWith(layout.buildDirectory.get().asFile.canonicalPath + File.separator)
        delete(root)
        def languages = (Locale.getISOLanguages().toList() + ["fil"]).unique().findAll { !["in", "iw", "ji"].contains(it) }
        languages.findAll { it != "ru" }.each { language ->
            // Android's resource matching still uses the legacy ISO codes.
            def resourceLanguage = ["he":"iw", "id":"in", "yi":"ji"].get(language, language)
            def base = new File(root, resourceLanguage.length() == 2 ? "values-${resourceLanguage}" : "values-b+${resourceLanguage}")
            base.mkdirs()
            new File(base, "strings.xml").setText('<resources><string name="app_name">Playerium</string><string name="title_activity_main">Playerium</string></resources>', "UTF-8")
            def qualifier = resourceLanguage.length() == 2 ? "values-${resourceLanguage}-rRU" : "values-b+${resourceLanguage}+RU"
            def folder = new File(root, qualifier)
            folder.mkdirs()
            new File(folder, "strings.xml").setText('<resources><string name="app_name">Проигрыватель</string><string name="title_activity_main">Проигрыватель</string></resources>', "UTF-8")
        }
    }
}
tasks.named("preBuild").configure { dependsOn("generateRegionalAppNames") }

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-session:1.3.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    implementation 'androidx.work:work-runtime:2.9.1'
    // Keep API22 compatibility; Messaging 26 raises the minimum Android version.
    implementation 'com.google.firebase:firebase-messaging:24.1.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
}
