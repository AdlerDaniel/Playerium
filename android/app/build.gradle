apply plugin: 'com.android.application'

android {
    namespace "com.playerium.music"
    compileSdk 34

    defaultConfig {
        applicationId "com.playerium.music"
        minSdk 22
        targetSdk 34
        versionCode 20
        versionName "1.7.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    def releaseStore = System.getenv("PLAYERIUM_KEYSTORE_PATH") ?: "playerium.keystore"
    def storePass = System.getenv("PLAYERIUM_STORE_PASSWORD")
    def keyPass = System.getenv("PLAYERIUM_KEY_PASSWORD")
    def aliasName = System.getenv("PLAYERIUM_KEY_ALIAS")
    def signingReady = file(releaseStore).exists() && storePass && keyPass && aliasName
    signingConfigs {
        release {
            if (signingReady) {
                storeFile file(releaseStore)
                storePassword storePass
                keyAlias aliasName
                keyPassword keyPass
            }
        }
    }
    gradle.taskGraph.whenReady { graph ->
        if (graph.allTasks.any { it.name.toLowerCase().contains("release") } && !signingReady) {
            throw new GradleException("Release signing secrets are missing. Configure the existing Playerium key; do not generate a replacement.")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packagingOptions { jniLibs { useLegacyPackaging true } }

    buildTypes {
        debug { }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-session:1.3.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
}
