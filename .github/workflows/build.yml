name: Build Playerium (EXE and APK)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python for Icon Generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate App Icons
        run: |
          python -m pip install pillow
          python scripts/generate_icons.py

      - name: Install Dependencies
        run: npm install

      - name: Build Windows Installer & Portable EXE
        shell: pwsh
        run: |
          $maxRetries = 2
          for ($i = 1; $i -le $maxRetries; $i++) {
            Write-Host "Build attempt $i of $maxRetries..."
            npm run build:win
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Windows build succeeded!"
              break
            }
            if ($i -eq $maxRetries) {
              Write-Error "Windows build failed after $maxRetries attempts."
              exit 1
            }
            Start-Sleep -Seconds 5
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows EXE Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Playerium-Windows-EXE
          path: dist/*.exe

  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python for Icon Generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate App Icons
        run: |
          python3 -m pip install pillow
          python3 scripts/generate_icons.py

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Sync Web Assets to Android
        run: |
          mkdir -p android/app/src/main/assets
          cp -r index.html css js assets android/app/src/main/assets/

      - name: Build Android Debug APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Playerium-1.0.4.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Playerium-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows-exe, build-android-apk]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Create release directory
        run: mkdir -p release-assets

      - name: Download Windows EXE Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Playerium-Windows-EXE
          path: release-assets

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: Playerium-Android-APK
          path: release-assets

      - name: Display Release Files
        run: ls -la release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          name: "Playerium v1.0.4"
          draft: false
          prerelease: false
          body: |
            ## 🎵 Playerium v1.0.4 — Layout Audit, Typography & Containment Engine

            Полный аудит верстки десктопного и мобильного интерфейсов с устранением выпадений текста, уродливых переносов и переполнений окон.

            ### 📦 Файлы для установки:
            - 💻 **Windows Установщик (Setup)**: `Playerium Setup 1.0.4.exe`
            - 🚀 **Windows Портативная версия (Portable)**: `Playerium 1.0.4.exe`
            - 📱 **Android Приложение**: `Playerium-1.0.4.apk`

            ### ✨ Что нового в v1.0.4:
            - 🛡️ **Защита от переполнения и обрезки текста (Zero Overflow)**:
              - Все flex- и grid-контейнеры получили `min-width: 0`, исключающий распирание панелей длинными названиями песен и путями к папкам
              - Длинные пути в настройках медиатеки теперь аккуратно сокращаются с троеточием и никогда не сдвигают кнопку удаления папки
              - Заголовки плейлистов переведены на плавный `clamp(20px, 3.2vw, 42px)` с `word-break: break-word`
              - Метаданные в правой панели десктопа теперь ограничены 3 строками с троеточием
            - 📱 **Мобильные оптимизации (Mobile Native)**:
              - Обложка в полноэкранном мобильном плеере теперь адаптируется под высоту экрана (`max-height: min(340px, 38vh)`), благодаря чему плеер, скруббер и текст песни помещаются на экран любого смартфона без вертикальной прокрутки
              - Уведомления (Toasts) на смартфонах позиционируются ровно над плавающим мини-плеером и навигацией
              - Модальные окна на смартфонах открываются снизу как аккуратный bottom-sheet со скругленными краями
              - Минимальный размер шрифта полей ввода зафиксирован на 16px для предотвращения нежелательного авто-зума экрана
            - 📐 **Адаптивная таблица треков**:
              - На экранах средней ширины (ноутбуки и узкие окна) колонка даты добавления скрывается автоматически, давая простор названию трека и альбому
            - 🧠 **Интегрированы новые дизайн-скиллы**:
              - `apple-design` (WWDC Fluid Interfaces) и `ui-layout-typography` (правила типографики и контейнеризации)
          files: |
            release-assets/*.exe
            release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
