name: Build Playerium (EXE and APK)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Windows Installer & Portable EXE
        shell: pwsh
        run: |
          $maxRetries = 2
          for ($i = 1; $i -le $maxRetries; $i++) {
            Write-Host "Build attempt $i of $maxRetries..."
            npm run build:win
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Windows build succeeded!"
              break
            }
            if ($i -eq $maxRetries) {
              Write-Error "Windows build failed after $maxRetries attempts."
              exit 1
            }
            Start-Sleep -Seconds 5
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows EXE Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Playerium-Windows-EXE
          path: dist/*.exe

  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Sync Web Assets to Android
        run: |
          mkdir -p android/app/src/main/assets
          cp -r index.html css js android/app/src/main/assets/

      - name: Build Android Debug APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Playerium-1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Playerium-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows-exe, build-android-apk]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Create release directory
        run: mkdir -p release-assets

      - name: Download Windows EXE Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Playerium-Windows-EXE
          path: release-assets

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: Playerium-Android-APK
          path: release-assets

      - name: Display Release Files
        run: ls -la release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Playerium v1.0.0"
          draft: false
          prerelease: false
          body: |
            ## 🎵 Playerium v1.0.0 — Official Release

            Локальный аудиоплеер в интерфейсе Spotify для Windows и Android.

            ### 📦 Файлы для установки:
            - 💻 **Windows Установщик (Setup)**: `Playerium Setup 1.0.0.exe`
            - 🚀 **Windows Портативная версия (Portable)**: `Playerium 1.0.0.exe`
            - 📱 **Android Приложение**: `Playerium-1.0.0.apk`

            ### ✨ Возможности:
            - Полный интерфейс Spotify (Sidebar, Topbar, Queue, Rightbar, Tracklist)
            - 10-полосный эквалайзер с пресетами (Bass Boost, Rock, Pop, Vocal Boost и др.)
            - Синхронизированные субтитры / текст песен (LRC & ID3 USLT)
            - Поиск, медиатека, плейлисты, любимые треки
            - Автообновление через GitHub Releases при каждом запуске
          files: |
            release-assets/*.exe
            release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
