name: Verify and build Playerium
on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: playerium-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "if (process.env.GITHUB_REF_NAME !== 'v' + require('./package.json').version) process.exit(1)"
  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow==11.1.0
      - run: python scripts/generate_icons.py
      - run: npm ci
      - run: npm run test:desktop
      - run: node tests/desktop/background.cjs
      - run: node tests/desktop/update-window.cjs
      - run: python scripts/prepare_music_runtime.py --windows
      - run: node tests/desktop/music-runtime.cjs
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: Playerium-Windows
          path: dist/*.exe
          if-no-files-found: error
  android:
    needs: verify
    runs-on: ubuntu-latest
    env:
      PLAYERIUM_STORE_PASSWORD: ${{ secrets.PLAYERIUM_STORE_PASSWORD }}
      PLAYERIUM_KEY_PASSWORD: ${{ secrets.PLAYERIUM_KEY_PASSWORD }}
      PLAYERIUM_KEY_ALIAS: ${{ secrets.PLAYERIUM_KEY_ALIAS }}
      PLAYERIUM_KEYSTORE_BASE64: ${{ secrets.PLAYERIUM_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow==11.1.0
      - run: python scripts/generate_icons.py
      - run: npm run android:assets
      - run: python scripts/prepare_music_runtime.py --android
      - run: python scripts/align_android_webp.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Verify debug build and Android lint
        run: |
          if ! gradle -p android assembleDebug lintDebug --no-daemon; then
            cat android/app/build/intermediates/lint_intermediate_text_report/debug/lint-results-debug.txt || true
            exit 1
          fi
      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-lint-report
          path: android/app/build/reports/lint-results-debug.*
      - name: Enable hardware acceleration for Android verification
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Android music runtime on a device
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: gradle -p android connectedDebugAndroidTest --no-daemon
      - name: Verify music processing on modern Android with 16 KB pages
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_ps16k
          arch: x86_64
          avd-name: playerium16k
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096
          script: |
            test "$(adb shell getconf PAGE_SIZE | tr -d '\r')" = 16384
            gradle -p android connectedDebugAndroidTest --no-daemon
      - name: Upload native music verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-music-runtime-report
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
      - name: Restore existing release key
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test -n "$PLAYERIUM_KEYSTORE_BASE64" || { echo 'Existing signing secrets must be configured before release'; exit 1; }
          printf '%s' "$PLAYERIUM_KEYSTORE_BASE64" | base64 --decode > android/app/playerium.keystore
      - name: Build signed release
        if: startsWith(github.ref, 'refs/tags/')
        run: gradle -p android assembleRelease --no-daemon
      - name: Name release APK
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p apk-dist
          cp android/app/build/outputs/apk/release/app-release.apk "apk-dist/Playerium-${GITHUB_REF_NAME#v}.apk"
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Playerium-Android
          path: apk-dist/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: Playerium-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  release:
    needs: [windows, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Playerium-*
          merge-multiple: true
          path: release-assets
      - name: Match published installer filenames
        run: |
          python - <<'PY'
          from pathlib import Path
          for source in Path('release-assets').glob('*.exe'):
              source.rename(source.with_name(source.name.replace(' ', '.')))
          PY
      - name: Calculate checksums
        run: cd release-assets && sha256sum *.exe *.apk > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.exe
            release-assets/*.apk
            release-assets/SHA256SUMS.txt
