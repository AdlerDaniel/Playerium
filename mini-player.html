<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data: https:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>Playerium</title><link rel="stylesheet" href="css/mini-player.css"></head><body>
<main><header><button id="openMain" aria-label="Открыть приложение">Проигрыватель ↗</button><button id="pin" aria-label="Поверх других окон" aria-pressed="true">⌖</button></header><section class="mini-track"><div class="mini-art"><img id="artwork" alt="" hidden><span id="artFallback" aria-hidden="true">♪</span></div><div class="mini-meta"><h1 id="title">Выберите трек</h1><p id="artist"></p><p id="device">Этот компьютер</p></div></section>
<label class="mini-seek"><span class="sr-only">Позиция песни</span><input id="seek" type="range" min="0" max="100" step="0.1" value="0"><span class="mini-times"><span id="position">0:00</span><span id="duration">0:00</span></span></label><div class="mini-controls"><button id="previous" aria-label="Предыдущий трек">◀</button><button id="toggle" aria-label="Воспроизвести">▶</button><button id="next" aria-label="Следующий трек">▶</button><button id="queue" aria-label="Показать очередь" aria-expanded="false">☷</button></div><label class="mini-volume">Громкость<input id="volume" type="range" min="0" max="100" value="80"></label><section id="upcoming" hidden aria-label="Следующие треки"></section><p id="status" role="status"></p></main><script src="js/mini-window.js"></script></body></html>
